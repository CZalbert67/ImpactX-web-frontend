<!doctype html>
<html lang="es" data-theme="impactx-neon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ImpactX conecta wearable, aplicación móvil y web para la seguridad vial, el monitoreo autorizado y el análisis de viajes."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ImpactX | Seguridad vial conectada</title>
    <script>
      (function () {
        var key = "impactx.theme";
        var themes = [
          "impactx-neon",
          "impactx-professional",
          "impactx-light",
        ];
        var theme = null;
        try {
          theme = localStorage.getItem(key);
        } catch (error) {
          theme = null;
        }
        if (themes.indexOf(theme) === -1) {
          theme = "impactx-neon";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
