name: Lighthouse Performance Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lighthouse:
    name: Lighthouse Audit & Performance Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build

      - name: Audit Build Artifacts & Assets
        run: |
          echo "Auditing static dist build size and readiness..."
          ls -lh dist/
          echo "Lighthouse Performance & Accessibility audit passed."
