name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: azure-static-web-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      VITE_API_BASE_URL: https://impactx-api-backend-h0eyf9c4fxd8dsbc.westus-01.azurewebsites.net

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy production to Azure Static Web Apps
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_GRASS_0FB211A0F }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
